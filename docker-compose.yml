# Example deployment. Put the settings in a .env file next to this one:
#
#   BIN_ROOT_ACCESS_KEY=admin
#   BIN_ROOT_SECRET_KEY=change-me-to-something-long
#   # equivalent names: BIN_ROOT_USER / BIN_ROOT_PASSWORD or BIN_ACCESS_KEY / BIN_SECRET_KEY
#   # optional: host ports (default 9000 for the S3 API, 9001 for the console)
#   BIN_S3_PORT=9000
#   BIN_CONSOLE_PORT=9001
#
# Then: docker compose up -d
#   S3 API:  http://localhost:9000   (aws --endpoint-url http://localhost:9000 s3 ls)
#   Console: http://localhost:9001
#
# Ports: BIN_S3_PORT / BIN_CONSOLE_PORT change the host side. To change the
# container side too, edit --address / --console-address in "command" and the
# right-hand side of "ports" to match; the healthcheck follows automatically.
services:
  bin:
    build: .
    image: bin:dev
    container_name: bin
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    ports:
      - "${BIN_S3_PORT:-9000}:9000"      # S3 API
      - "${BIN_CONSOLE_PORT:-9001}:9001" # web console
    # Every accepted name is passed through; bin uses whichever is set (empty
    # means unset) and refuses to start, saying so in its log, if none is.
    # No ":?" guards here: they would also break "docker compose down/logs".
    environment:
      BIN_ROOT_ACCESS_KEY: ${BIN_ROOT_ACCESS_KEY:-}
      BIN_ROOT_USER: ${BIN_ROOT_USER:-}
      BIN_ACCESS_KEY: ${BIN_ACCESS_KEY:-}
      BIN_ROOT_SECRET_KEY: ${BIN_ROOT_SECRET_KEY:-}
      BIN_ROOT_PASSWORD: ${BIN_ROOT_PASSWORD:-}
      BIN_SECRET_KEY: ${BIN_SECRET_KEY:-}
      BIN_REGION: us-east-1
    volumes:
      - bin-data:/data
    # The image has no curl or wget: bin checks itself.
    # Load balancers can also probe http://<host>:9000/_health/live.
    healthcheck:
      test: ["CMD", "bin", "healthcheck"]
      interval: 30s
      timeout: 20s
      retries: 3
    logging:
      options:
        max-size: "100m"
        max-file: "3"

volumes:
  bin-data:
    # A fixed name (no project prefix), so this is the same volume that
    # `docker run -v bin-data:/data` uses: switching between the two keeps the data.
    name: bin-data
    driver: local
